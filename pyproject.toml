[project]
name = "scfs-miraepass-backend"
version = "1.7.0.dev2"
description = "순천미래과학고등학교 포인트 시스템, 미래 패스 - BACKEND"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.135.1",
    "hangulpy>=1.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=7.3.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "sqlmodel>=0.0.37",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
]
